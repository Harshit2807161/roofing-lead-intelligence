services:
  db:
    # Postgres with pgvector, so the P1 chat's embeddings live in the same database.
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: leads
      POSTGRES_PASSWORD: leads
      POSTGRES_DB: leads
    ports:
      - "5433:5432"   # 5432 is taken on the dev machine
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leads -d leads"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
