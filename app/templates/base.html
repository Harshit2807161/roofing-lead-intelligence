<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Roofing Leads{% endblock %}</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,400&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap">
  {% block head %}{% endblock %}
  <link rel="stylesheet" href="/static/tokens.css">
  <link rel="stylesheet" href="/static/app.css">
  <script src="https://unpkg.com/htmx.org@2.0.4/dist/htmx.min.js" defer></script>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="/">
        <span class="pip" aria-hidden="true"></span>
        <span class="brand-name">Roofing Leads</span>
        <span class="brand-sub">GAF directory · ZIP 10013 · 25 mi</span>
      </a>
      <nav class="topnav" aria-label="Main">
        <a href="/" {% if active == "leads" %}aria-current="page"{% endif %}>Leads</a>
        <a href="/style" {% if active == "style" %}aria-current="page"{% endif %}>Style</a>
        <a href="/docs">API</a>
      </nav>
    </div>
  </header>
  <main class="page">
    {% block content %}{% endblock %}
  </main>
  {% block scripts %}{% endblock %}
</body>
</html>
